[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-trial-protocol"
version = "0.1.0"
description = "Protocol-only ChatGPT account registration and checkout link generator."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "curl_cffi>=0.7,<1",
    "httpx>=0.27,<1",
    "h2>=4,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
gpt-trial = "gpt_trial_protocol.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
